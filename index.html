<style>
/* Layout: navy masthead + white tab strip full-bleed; content column widens and scales up for TV */
:root{
  --navy:#0c2b44; --navy-2:#08213a; --navy-3:#163a57; --navy-line:#34536d; --blue:#1f8fe5; --blue-2:#8cc8f5; --sky:#a9cbe6; --yellow:#f2e205;
  --bg:#f1f3f5; --surface:#ffffff; --sunk:#e8edf1; --ink:#0c2b44; --muted:#5d6f7e; --line:#dde3e8; --line-2:#c9d3db;
  --court:#0c2b44; --court-ink:#ffffff; --ball:#f2e205; --on-ball:#0c2b44;
  --win:#1a7f45; --win-bg:#e2f3e9; --lose:#c9302c; --lose-bg:#fbe7e5; --warn-bg:#fff6b8; --warn:#5b5000;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;letter-spacing:-.005em;text-wrap:balance;text-transform:uppercase}
h2{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line-2);background:var(--surface);border-radius:0;padding:0 16px;min-height:44px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease)}
button:hover{border-color:var(--navy)}
button:active{transform:scale(.97)}
button:disabled{cursor:default;opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:#1478c4;border-color:#1478c4}
button.ball{background:var(--blue);color:#fff;border-color:var(--blue);min-height:52px;font-size:12px;letter-spacing:.16em;padding:0 22px}
button.ball:hover{background:#1478c4}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:0 10px}
button.ghost:hover{color:var(--navy);border-color:transparent}
button.danger{color:var(--lose)}
button.danger:not(.ghost){border-color:var(--lose);background:var(--lose);color:#fff}
.endbtn{background:var(--lose)!important;color:#fff!important;border-color:var(--lose)!important;min-height:52px!important;font-size:12px!important;letter-spacing:.16em!important;padding:0 24px!important}
.endbtn:hover{filter:brightness(1.08)}
input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:0;padding:10px 12px;min-height:44px;min-width:0}
textarea{width:100%;resize:vertical}

.top{background:var(--navy);padding-top:env(safe-area-inset-top,0px)}
.ticker{background:var(--navy-2);color:#fff;display:flex;align-items:center;gap:12px;padding:9px 16px;min-height:38px;overflow:hidden}
.tk-label{background:var(--blue);font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:5px 9px;white-space:nowrap;flex:none}
.tk-text{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tk-text.swap{animation:tkIn .5s var(--ease)}
.hin{max-width:1360px;margin:0 auto;padding-inline:16px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{font-family:var(--display);color:#fff;font-size:21px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.brand b{font-weight:900;letter-spacing:.02em}
.sub{margin:0;font-size:12px;color:var(--sky);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub .pill{background:transparent}
.sub button.ghost{color:var(--sky);min-height:32px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sky);display:inline-block}
.dot.on{background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2s infinite}
.tabs{position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line);background:var(--surface);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:2px;max-width:1360px;margin:0 auto;padding-inline:8px;width:100%}
.tabs button{border:none;background:none;min-height:48px;padding:0 12px;color:var(--muted);font-size:12px;letter-spacing:.12em;position:relative;white-space:nowrap}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--blue);transform:scaleX(0);transition:transform .3s var(--ease)}
.tabs button[aria-selected="true"]{color:var(--navy)}
.tabs button[aria-selected="true"]::after{transform:scaleX(1)}

.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
section{display:flex;flex-direction:column;gap:18px;padding-top:24px}
.phead{display:flex;flex-direction:column;gap:8px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.eyebrow::before{content:"";width:10px;height:10px;background:var(--blue);flex:none}
.ptitle{font-size:clamp(34px,6vw,60px);line-height:1}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .grow{flex:1}
.lbl{font-family:var(--display);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px 16px}
.panel h2{margin-bottom:10px}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.court{background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.court-h{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.court-h h3{font-size:19px;letter-spacing:.03em}
.court-h span{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.team{display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:12px;align-items:center;padding:14px 16px}
.team + .team{border-top:1px dashed var(--line)}
.names{font-weight:600;font-size:16px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.names small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
.score{width:68px;height:58px;text-align:center;font-family:var(--display);font-size:28px;font-weight:900;padding:0;border:2px solid var(--line-2);color:var(--navy)}
.score:focus{border-color:var(--navy)}
.prob{display:flex;height:8px;margin:2px 16px 0;overflow:hidden;background:var(--blue-2)}
.prob i{display:block;background:var(--navy);transform-origin:left}
.court-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:10px;padding:5px 8px;background:var(--sunk);color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;border-radius:0}
.pill.keo{background:var(--yellow);color:var(--navy)}
.pill.win{background:var(--win-bg);color:var(--win)}
.pill.lose{background:var(--lose-bg);color:var(--lose)}
.pill.cap{background:var(--yellow);color:var(--navy)}
.pill.gF{background:transparent;color:var(--lose);border:1px solid currentColor;padding:2px 5px;font-size:9px}
.pill.gM{background:transparent;color:#1f6fb5;border:1px solid currentColor;padding:2px 5px;font-size:9px}
.err{color:var(--lose);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);padding:8px 12px;font-size:14px;font-weight:500;background:var(--surface)}
.chip b{font-weight:400;color:var(--muted);margin-left:4px;font-size:12px}
.empty{border:2px dashed var(--line-2);padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;margin-bottom:6px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
table{color:inherit;border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:none}
td.rank{font-family:var(--display);font-size:20px;font-weight:900;text-align:left;width:44px}
tr.top1 td.rank{color:var(--blue)}
.up{color:var(--win)} .down{color:var(--lose)}
.dark{background:var(--navy);color:#fff;margin-inline:-16px;padding:26px 16px 32px;display:flex;flex-direction:column;gap:16px}
.dark .tbl-wrap{background:transparent;border-color:var(--navy-line)}
.dark th{color:var(--sky);border-color:var(--navy-line)}
.dark td{border-color:var(--navy-3)}
.dark td .meta{color:var(--sky)}
.dark tr.top1 td.rank{color:var(--yellow)}
.dark .up{color:#6fd39b}.dark .down{color:#ff8f86}
.dark .rule{color:var(--sky)}
.dark .pill.cap{background:var(--yellow)}
.no1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px;gap:10px}
.no1 .k{white-space:nowrap}.no1 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.no1 .t{flex:1}
.no1 > div{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.no1 .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.no1 .k{text-transform:uppercase;font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.18em;color:var(--sky)}
.no1 .n{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1}
.no1 .v{font-family:var(--display);font-weight:800;font-size:30px;color:var(--yellow)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .sc{font-family:var(--display);font-size:22px;font-weight:900;white-space:nowrap}
.hrow .who{font-size:14px;min-width:0;overflow-wrap:anywhere}
.hrow .who .l{color:var(--muted)}
.mrow{padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
@media (max-width:560px){.mhead{grid-template-columns:auto minmax(0,1fr)}.mhead > .bar{grid-column:1 / -1}}
.mname{min-width:0;overflow-wrap:anywhere;font-weight:500}
.code{font-family:var(--display);font-weight:800;font-size:14px;background:var(--navy);color:#fff;min-width:52px;height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;white-space:nowrap}
.meta{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:16px}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:900;line-height:1.1;margin-top:4px}
.kpi.hl{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hl .lbl{color:var(--sky)}
.kpi.hl .v{color:var(--yellow)}
.cbar{display:flex;height:12px;gap:3px;margin:4px 0 12px}
.cbar span{display:block;transform-origin:left}
.cleg{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cleg div{display:flex;align-items:center;gap:10px;font-weight:600}
.cleg i{width:10px;height:10px;display:block}
.cleg b{margin-left:auto;font-family:var(--display);font-weight:900;font-size:18px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:6px}
.form input,.form select{width:100%}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);background:var(--surface)}
.stepper button{border:none;background:none;min-width:44px;font-size:18px;padding:0}
.stepper span{min-width:32px;text-align:center;font-family:var(--display);font-size:20px;font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(12,43,68,.25);animation:toastIn .35s var(--ease)}
.ro{background:var(--surface);border:1px solid var(--line);border-left:0;padding:12px 14px;font-size:13px;color:var(--muted)}
.ro.login{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:inset 4px 0 0 var(--blue)}
.rule{font-size:13px;color:var(--muted);margin:0;line-height:1.55}
.seg{display:inline-flex;border:1px solid var(--line-2);background:var(--surface)}
.seg button{border:none;min-height:44px;padding:0 14px;background:none;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sessh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;text-decoration:none;color:var(--ink);gap:12px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:0;min-height:52px;font-family:var(--body);font-weight:400;font-size:15px;letter-spacing:0;text-transform:none}
.subh{font-size:15px;margin:18px 0 8px}
.pick{display:flex;flex-direction:column;margin-top:12px;max-height:400px;overflow-y:auto;border:1px solid var(--line)}
.pickrow{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.pickrow:hover{background:var(--sunk)}
.pickrow input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--blue)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

.dseg{border-color:var(--navy-line);background:transparent}
.dseg button{color:var(--sky)}
.dseg button+button{border-left-color:var(--navy-line)}
.dseg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.av{--s:36px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.42);line-height:1;background:var(--sunk);box-shadow:0 0 0 2px var(--surface);vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xs{--s:24px}.av.sm{--s:30px}.av.md{--s:44px}.av.lg{--s:clamp(54px,14vw,96px);box-shadow:0 0 0 3px var(--yellow)}
.avs{display:inline-flex;flex:none}.avs .av+.av{margin-left:-10px}
.dark .av,.court-h .av,.no1 .av:not(.lg){box-shadow:0 0 0 2px var(--navy)}
.tl{display:flex;align-items:center;gap:12px;min-width:0}
.pn{display:inline-flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px}
.avr{display:inline-flex;align-items:center;gap:8px}
.avup{position:relative;cursor:pointer;display:inline-flex;border-radius:50%}
.avup input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.avup i{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-weight:800;font-size:13px;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.avup:hover .av{filter:brightness(.92)}
.hero{background:var(--navy);color:#fff;margin-inline:-16px;padding:22px 16px 26px;display:flex;flex-direction:column;gap:18px}
.hero .eyebrow{color:var(--sky)}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:.95;margin:0}
.hero .hmeta{margin:0;font-size:14px;color:var(--sky)}
.spot{background:var(--navy-3);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px}
.spot .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.2em;color:var(--navy);background:var(--yellow);padding:4px 7px;align-self:flex-start;text-transform:uppercase}
.spot .n{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,40px);line-height:1.05;overflow-wrap:anywhere}
.spot .r{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.spot .r b{font-family:var(--display);font-weight:900;font-size:clamp(36px,7vw,56px);color:var(--yellow);line-height:1}
.av.xl{--s:clamp(84px,24vw,140px);box-shadow:0 0 0 4px var(--yellow)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--navy-3);padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
.mini .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .k{font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.16em;color:var(--sky);text-transform:uppercase}
.mini .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font-family:var(--display);font-weight:900;font-size:22px;color:#fff}
.mini .v.y{color:var(--yellow)}
.mini .v.s{font-size:12px;font-weight:600;font-family:var(--body);line-height:1.4;color:#fff}
.lb{background:var(--surface);border:1px solid var(--line)}
.lbr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.lbr:last-child{border-bottom:none}
.lbr .rk{font-family:var(--display);font-weight:900;font-size:19px}
.lbr.top1 .rk{color:var(--blue)}
.lbr .who{display:flex;align-items:center;gap:12px;min-width:0}
.lbr .who .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.lbr .who b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function derive(){

  const sid=c.session||1, SM=S.matches.filter(m=>(m.session||1)===sid), SB=S.batches.filter(b=>(b.session||1)===sid);
  const all=new Map(players.map(p=>[p.id,{g:0,w:0,ses:new Set()}]));
  for(const m of S.matches)if(m.status==="done"){const aWin=m.sa>m.sb;
    for(const id of m.a){const x=all.get(id);if(x){x.g++;if(aWin)x.w++;x.ses.add(m.session||1)}}
    for(const id of m.b){const x=all.get(id);if(x){x.g++;if(!aWin)x.w++;x.ses.add(m.session||1)}}}

  for(const m of done){
    const ra=avg(m.a),rb=avg(m.b),pA=expect(ra,rb);
    const aWin=m.sa>m.sb, share=m.sa/(m.sa+m.sb);
    const eS=expShare(pA), dA=K*(share-eS);
    const loserP=aWin?1-pA:pA, fee=(c.thu||"keo")!=="keo"?0:feeFor(loserP,c);

    for(const id of m.b){const s=st.get(id);if(!s)continue;s.g++;s.pf+=m.sb;s.pa+=m.sa;s.last=Math.max(s.last,m.seq);if(!aWin)s.w++;else{s.l++;s.fee+=fee;if(!m.giai)s.losses++}rating.set(id,Math.min(8,Math.max(1,rating.get(id)-dA)))}

  return {c,sid,SM,SB,all,players,pmap,st,info,done,playing:SM.filter(m=>m.status!=="done").sort((a,b)=>a.court-b.court)};
}

function av(p,cls=""){
  if(!p)return `<span class="av ${cls}"></span>`;
  const n=String(p.name||"?").trim(),w=n.split(/\s+/),ini=(w[w.length-1]||"?").charAt(0).toUpperCase();
  if(p.photo&&/^data:image\//.test(p.photo))return `<span class="av ${cls}"><img src="${esc(p.photo)}" alt="" decoding="async"></span>`;
  let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="av ${cls}" style="background:${AVC[h%AVC.length]}" aria-hidden="true">${esc(ini)}</span>`;
}
const avId=(D,id,cls)=>av(D.pmap.get(id),cls);
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h),N=160,c=document.createElement("canvas");c.width=c.height=N;
    const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,N,N);return c.toDataURL("image/jpeg",.8)}
  finally{URL.revokeObjectURL(url)}
}

function standings(D){
  return D.players.filter(p=>p.active!==false||D.st.get(p.id).g>0).map(p=>({p,s:D.st.get(p.id)})).sort((x,y)=>{
    const a=x.s,b=y.s; if(!!a.g!==!!b.g)return a.g?-1:1;
    const wa=a.g?a.w/a.g:0,wb=b.g?b.w/b.g:0; if(wb!==wa)return wb-wa;
    const da=a.pf-a.pa,dbb=b.pf-b.pa; if(dbb!==da)return dbb-da; return b.rating-a.rating;});
}

const THU={keo:"Kèo thua góp",deu:"Chia đều chi phí",phi:"Lệ phí cố định",khong:"Quỹ CLB trả"};
const GT={khong:"Không có giải",trich:"Trích % phần dư",codinh:"Số tiền cố định",gop:"Góp thêm vào giải"};
function money(D){
  const c=D.c,thu=c.thu||"keo",gt=c.gt||"khong",cs=c.costs||{};
  const cost=(+cs.court||0)+(+cs.water||0)+(+cs.ball||0)+(+cs.other||0);
  const att=D.players.filter(p=>D.st.get(p.id).g>0),n=att.length;
  const games=att.reduce((s,p)=>s+D.st.get(p.id).g,0);
  const base=new Map(),bu=new Map(),gop=new Map();
  for(const p of att)base.set(p.id,thu==="keo"?D.st.get(p.id).charged:thu==="deu"?(n?Math.ceil(cost/n):0):thu==="phi"?(+c.phi||0):0);
  const fund=[...base.values()].reduce((a,b)=>a+b,0),gap=fund-cost;
  if(thu==="keo"&&gap<0&&games)for(const p of att)bu.set(p.id,Math.ceil(-gap*D.st.get(p.id).g/games));
  const buTot=[...bu.values()].reduce((a,b)=>a+b,0);
  if(gt==="gop")for(const p of att)gop.set(p.id,+c.gtv||0);
  const gopTot=[...gop.values()].reduce((a,b)=>a+b,0),surplus=fund+buTot-cost;
  const pot=gt==="trich"?Math.floor(Math.max(0,gap)*(+c.gtv||0)/100):gt==="codinh"?(+c.gtv||0):gt==="gop"?gopTot:0;
  const club=surplus-(gt==="trich"||gt==="codinh"?pot:0);
  const baseOf=id=>base.get(id)||0,shareOf=id=>bu.get(id)||0,gopOf=id=>gop.get(id)||0,payOf=id=>baseOf(id)+shareOf(id)+gopOf(id);
  return {thu,gt,cost,att,fund,gap,buTot,gopTot,pot,club,collected:fund+buTot+gopTot,baseOf,shareOf,gopOf,payOf,perGame:thu==="keo"&&gap<0&&games?-gap/games:0,share:Math.max(0,...bu.values())};
}
function prizes(D,M){
  if(!M.pot)return [];
  if(isG(D.c)){const GD=gDerive(D);if(!GD)return [];const parts=String(D.c.chia||"50,30,20").split(",").map(Number),T=GD.table.filter(t=>!t.out);
    return parts.map((p,i)=>T[i]?{label:["Vô địch","Hạng 2","Hạng 3"][i],ids:[T[i].p.a,T[i].p.b],k:Math.round(M.pot*p/100)}:null).filter(Boolean)}
  const st=standings(D).filter(r=>r.s.g),avg=st.reduce((a,r)=>a+r.s.g,0)/(st.length||1),ok=st.filter(r=>r.s.g>=0.7*avg);
  const m=ok.find(r=>r.p.gender!=="F"),f=ok.find(r=>r.p.gender==="F"),w=[m&&{label:"Số 1 nam",ids:[m.p.id]},f&&{label:"Số 1 nữ",ids:[f.p.id]}].filter(Boolean);
  w.forEach(x=>x.k=Math.round(M.pot/w.length));return w;
}
const hClub=h=>h&&h.money?(h.money.club!=null?h.money.club:(h.money.gap||0)):0;
function clubFund(before){return S.hist.filter(h=>before==null||h.sid<before).reduce((a,h)=>a+hClub(h),0)}
function moneySnap(D,M){
  const pz=prizes(D,M);
  return {thu:M.thu,gt:M.gt,gtv:+D.c.gtv||0,chia:D.c.chia||"",phi:+D.c.phi||0,fund:M.fund,cost:M.cost,gap:M.gap,buTot:M.buTot,gopTot:M.gopTot,pot:M.pot,club:M.club,collected:M.collected,share:M.share,perGame:M.perGame,costs:{...D.c.costs},
    prizes:pz.map(x=>({label:x.label,ids:x.ids,names:x.ids.map(id=>D.pmap.get(id)?.name||"?"),k:x.k}))};
}
const payRow=(D,M,id)=>{const s=D.st.get(id);return {charged:s.charged,capped:!!s.capped,base:M.baseOf(id),bu:M.shareOf(id),gop:M.gopOf(id),pay:M.payOf(id)}};

function prizeCards(D,list){
  if(!list||!list.length)return "";
  return `<div class="przs">${list.map(x=>`<div class="prz"><span class="avs">${x.ids.map((id,i)=>av(D.pmap.get(id)||{name:(x.names||[])[i]||"?"},"md")).join("")}</span><span class="t"><span class="k">${esc(x.label)}</span><b>${x.ids.map((id,i)=>esc(D.pmap.get(id)?.name||(x.names||[])[i]||"?")).join(" &amp; ")}</b></span><span class="v num">${fmtK(x.k)}</span></div>`).join("")}</div>`;
}
function payTable(D,sid,list,paid,live){

  if(!pr.length)return `<p class="rule">Buổi này không ai phải đóng tiền.</p>`;
  const n=pr.filter(r=>r.pay>0).length,p=pr.filter(r=>r.pay>0&&paid[r.id]).length;
  const bd=r=>[r.base?`${r.kind||"tiền buổi"} ${fmtK(r.base)}${r.capped?" (trần)":""}`:"",r.bu?`bù ${fmtK(r.bu)}`:"",r.gop?`giải ${fmtK(r.gop)}`:""].filter(Boolean).join(" + ");
  return `<div class="tbl-wrap"><table class="payt"><thead><tr><th>Tên</th><th>Phải đóng</th></tr></thead><tbody>${pr.map(r=>`<tr><td><span class="pn">${av(r.P,"sm")}<span><b>${esc(r.name)}</b><span class="meta" style="display:block">${r.g} trận · thua ${r.l}</span><span class="meta" style="display:block">${bd(r)}</span></span></span></td><td><div class="paycell"><b>${fmtK(r.pay)}</b>${paid[r.id]?`<span class="paidpill">✓ Đã nhận</span>`:r.pay>0?`<button class="paybtn" data-act="pay" data-sid="${sid}" data-n="${esc(r.name)}" data-k="${r.pay}">Chuyển tiền</button>`:""}${canWrite&&!live&&r.pay>0?`<button class="ghost paidtg" data-act="paid" data-id="${sid}" data-p="${r.id}">${paid[r.id]?"Bỏ dấu":"Đã nhận?"}</button>`:""}</div></td></tr>`).join("")}</tbody><tfoot><tr><td>TỔNG THU${n&&!live?` · ĐÃ NHẬN ${p}/${n}`:""}</td><td><b class="num">${fmtK(tot)}</b></td></tr></tfoot></table></div>`;
}

    <div class="bar" style="margin-top:10px"><button class="endbtn" data-act="reset">${Date.now()<resetArm?"Bấm lần nữa để xác nhận kết thúc":`Kết thúc buổi #${D.sid}`}</button></div></div>`;

function moneySec(D,sid,snap,rows,P,noPrize){

  if(!noPrize&&nw&&M.prizes&&M.prizes.length)h+=`<div class="shd"><h2>Giải thưởng</h2></div>${prizeCards(D,M.prizes)}<p class="rule">Quỹ giải ${fmtK(M.pot)} · ${esc(GT[M.gt]||"")}${M.gt==="trich"?` ${M.gtv}% phần dư`:""}.</p>`;
  h+=payTable(D,sid,rows.map(r=>({id:r.id,name:r.name,P:P(r),kind:{keo:"kèo",deu:"chia đều",phi:"lệ phí"}[M.thu]||"kèo",g:r.w+r.l,l:r.l,capped:r.capped,base:r.base!=null?r.base:(r.charged||0),bu:r.bu!=null?r.bu:Math.max(0,(r.pay||0)-(r.charged||0)),gop:r.gop||0,pay:r.pay||0})),paid,false);
  return h;
}
function sessList(D){
  const ids=new Set();for(const m of S.matches)if(m.status==="done"&&(m.session||1)<D.sid)ids.add(m.session||1);
  for(const h of S.hist)if(h.sid<D.sid)ids.add(h.sid);
  return [...ids].sort((a,b)=>b-a).map(sid=>{
    const snap=S.hist.find(h=>h.sid===sid);
    const ms=S.matches.filter(m=>m.status==="done"&&(m.session||1)===sid).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
    let rows=snap?snap.rows:null;
    if(!rows){const t=new Map();for(const m of ms){const aw=m.sa>m.sb;
      for(const [ids,f,a,w] of [[m.a,m.sa,m.sb,aw],[m.b,m.sb,m.sa,!aw]])for(const id of ids){const x=t.get(id)||{id,name:D.pmap.get(id)?.name||"(đã xóa)",w:0,l:0,pf:0,pa:0};w?x.w++:x.l++;x.pf+=f;x.pa+=a;t.set(id,x)}}
      rows=[...t.values()].sort((x,y)=>(y.w/(y.w+y.l))-(x.w/(x.w+x.l))||(y.pf-y.pa)-(x.pf-x.pa))}
    const at=snap?.startedAt||ms[0]?.doneAt||ms[0]?.createdAt||0;
    return {sid,snap,ms,rows,at};
  });
}

const GMAX=10, GSLOT=11;
const gk=(x,y)=>x<y?x+"~"+y:y+"~"+x;
const isG=c=>c.fmt==="giai";
const dur=m=>m<60?`${m} phút`:`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`;
const pzTxt=k=>k?(Math.round(k*1000)).toLocaleString("vi-VN")+"đ":"";
function rrSchedule(ids){
  const a=ids.slice();if(a.length%2)a.push(null);
  const n=a.length,R=[];
  for(let r=0;r<n-1;r++){const g=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)g.push(r%2?[y,x]:[x,y])}R.push(g);a.splice(1,0,a.pop())}
  return R;
}
const pairOf=(D,p)=>p?[D.pmap.get(p.a),D.pmap.get(p.b)]:[];
const pairNm=(D,p)=>p?`${nm(D,p.a)} &amp; ${nm(D,p.b)}`:"?";
const pairTx=(D,p)=>p?`${D.pmap.get(p.a)?.name||"?"} & ${D.pmap.get(p.b)?.name||"?"}`:"?";
const pairAv=(D,p,cls)=>`<span class="avs">${avId(D,p.a,cls)}${avId(D,p.b,cls)}</span>`;
const pairR=(D,p)=>((D.st.get(p.a)?.rating??3)+(D.st.get(p.b)?.rating??3))/2;
function gDerive(D){
  const c=D.c,G=c.giai;if(!isG(c)||!G)return null;
  const pairs=G.pairs||[],pm=new Map(pairs.map(p=>[p.id,p])),out=G.out||{};
  const rounds=rrSchedule(pairs.map(p=>p.id));
  const byKey=new Map();for(const m of D.SM)if(m.giai)byKey.set(gk(m.pa,m.pb),m);
  const games=[];
  rounds.forEach((g,ri)=>g.forEach(([x,y],i)=>{const m=byKey.get(gk(x,y));let st="wait",wo=null,sx=null,sy=null;
    if(m&&m.status==="done"){st="done";sx=m.pa===x?m.sa:m.sb;sy=m.pa===x?m.sb:m.sa}
    else if(m)st="live";
    else if(out[x]||out[y]){st="wo";wo=out[x]&&out[y]?null:(out[x]?y:x)}
    games.push({r:ri+1,i,x,y,key:gk(x,y),m,st,wo,sx,sy})}));
  const T=new Map(pairs.map((p,i)=>[p.id,{p,no:i+1,gp:0,w:0,l:0,pf:0,pa:0,wo:0,out:!!out[p.id]}]));
  const win=g=>g.st==="wo"?g.wo:g.st==="done"?(g.sx>g.sy?g.x:g.y):null;
  for(const g of games){const X=T.get(g.x),Y=T.get(g.y);
    if(g.st==="done"){X.gp++;Y.gp++;X.pf+=g.sx;X.pa+=g.sy;Y.pf+=g.sy;Y.pa+=g.sx;if(g.sx>g.sy){X.w++;Y.l++}else{Y.w++;X.l++}}
    else if(g.st==="wo"&&g.wo){const W=g.wo===g.x?X:Y,L=g.wo===g.x?Y:X;W.w++;W.wo++;W.gp++;L.l++;L.gp++}}
  const list=[...T.values()].sort((a,b)=>(a.out-b.out)||(b.w-a.w));
  const table=[];
  for(let i=0;i<list.length;){let j=i;while(j<list.length&&list[j].out===list[i].out&&list[j].w===list[i].w)j++;
    const grp=list.slice(i,j),ids=new Set(grp.map(t=>t.p.id));
    for(const t of grp)t.h2h=games.filter(g=>ids.has(g.x)&&ids.has(g.y)&&win(g)===t.p.id).length;
    grp.sort((a,b)=>(b.h2h-a.h2h)||((b.pf-b.pa)-(a.pf-a.pa))||(b.pf-a.pf)||(pairR(D,b.p)-pairR(D,a.p)));
    table.push(...grp);i=j}
  const resolved=games.filter(g=>g.st==="done"||g.st==="wo").length;
  const curR=(games.find(g=>g.st==="wait"||g.st==="live")||{r:rounds.length}).r;
  return {G,pairs,pm,out,rounds:rounds.length,games,T,table,win,resolved,total:games.length,complete:games.length>0&&resolved===games.length,curR,locked:!!G.locked};
}
const lexLt=(a,b)=>{for(let k=0;k<a.length;k++)if(a[k]!==b[k])return a[k]<b[k];return false};
function gLast(D){const t=new Map();for(const m of D.done)if(m.giai)for(const p of [m.pa,m.pb])t.set(p,Math.max(t.get(p)||0,m.doneAt||0));return t}
function gPick(D,GD,busy,rest){
  const lastT=gLast(D),now=Date.now(),off=GD.G.rest||{},rem=new Map();
  for(const g of GD.games)if(g.st==="wait")for(const p of [g.x,g.y])rem.set(p,(rem.get(p)||0)+1);
  const tired=p=>rest.has(p)||(lastT.has(p)&&now-lastT.get(p)<180000)?1:0;
  let best=null,bs=null;
  GD.games.forEach((g,i)=>{if(g.st!=="wait"||busy.has(g.x)||busy.has(g.y)||off[g.x]||off[g.y])return;
    const s=[tired(g.x)+tired(g.y),-(rem.get(g.x)+rem.get(g.y)),i];
    if(!bs||lexLt(s,bs)){bs=s;best=g}});
  return best;
}
async function gFill(){
  await new Promise(r=>setTimeout(r,30));
  const D=derive(),GD=gDerive(D);if(!GD||!GD.locked)return 0;
  const used=new Set(D.playing.map(m=>m.court)),free=[];for(let i=1;i<=D.c.courts;i++)if(!used.has(i))free.push(i);
  if(!free.length)return 0;
  const busy=new Set(D.playing.filter(m=>m.giai).flatMap(m=>[m.pa,m.pb]));
  const lastDone=D.done.filter(m=>m.giai).slice(-Math.max(1,D.c.courts-1));
  const rest=new Set(lastDone.flatMap(m=>[m.pa,m.pb]));
  const pick=[];for(const ct of free){const g=gPick(D,GD,busy,rest);if(!g)break;busy.add(g.x);busy.add(g.y);pick.push([ct,g])}
  if(!pick.length)return 0;
  const lock=await db.doc("app/lock").acquire({holder,ttlMs:5000});
  if(!lock.acquired){toast("Có người khác đang xếp trận, thử lại sau vài giây.");return 0}
  let seq=D.SM.reduce((m,x)=>Math.max(m,x.seq||0),0);const now=Date.now();
  await write(async()=>{for(const [ct,g] of pick){const X=GD.pm.get(g.x),Y=GD.pm.get(g.y);seq++;
    await db.collection("matches").doc().set({session:D.sid,seq,court:ct,giai:true,pa:g.x,pb:g.y,round:g.r,a:[X.a,X.b],b:[Y.a,Y.b],sa:null,sb:null,status:"playing",createdAt:now})}
    S.everWrote=true},null);
  return pick.length;
}
function validG(a,b){
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a===b)return "Nhập điểm hai đội, không được hòa.";
  return Math.max(a,b)===11&&Math.min(a,b)<=10?null:"Đội thắng đúng 11 điểm, đội thua từ 0 đến 10.";
}

function gSetup(D,G){
  const c=D.c,P=G.pairs||[],n=P.length,tot=n*(n-1)/2,mins=Math.ceil(tot/Math.max(1,c.courts))*GSLOT,pz=G.prizes||[0,0,0];
  const used=new Set(P.flatMap(p=>[p.a,p.b]));
  const free=D.players.filter(p=>p.active!==false&&!used.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,"vi"));
  let h=`<div class="gstrip"><div><b class="num">${n}/${GMAX}</b><small>Cặp</small></div><div><b class="num">${tot}</b><small>Trận</small></div><div><b class="num">${Math.max(0,n-1)}</b><small>Trận/cặp</small></div><div><b class="num">${n>1?dur(mins):"–"}</b><small>Với ${c.courts} sân</small></div></div>
  <div class="bar">${courtStep(c)}<span class="pill">Chạm 11 · không cần cách 2</span><span class="pill">Vòng tròn · gặp nhau 1 lần</span></div>`;
  {const rec=Math.max(1,Math.floor(n/4));if(n>=3&&c.courts>rec)h+=`<div class="warnbox"><b>${n} cặp mà mở ${c.courts} sân thì nhiều cặp sẽ phải đánh liền, không kịp nghỉ.</b> Để cặp nào cũng có nghỉ giữa các trận, nên dùng ${rec} sân (khoảng 4 cặp cho mỗi sân).</div>`}
  h+=`<div class="panel"><div class="bar" style="margin-bottom:4px"><h2 class="grow">Các cặp</h2><span class="meta num">${n} cặp</span></div>`;

const key=(x,y)=>x<y?x+"|"+y:y+"|"+x;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function generate(){
  const D=derive(),c=D.c;
  const used=new Set(D.playing.map(m=>m.court));
  const freeCourts=[];for(let i=1;i<=c.courts;i++)if(!used.has(i))freeCourts.push(i);
  const busy=new Set(D.playing.flatMap(m=>[...m.a,...m.b]));
  const avail=D.players.filter(p=>p.active!==false&&!busy.has(p.id)).map(p=>p.id);
  const n=Math.min(freeCourts.length,Math.floor(avail.length/4));
  if(!freeCourts.length){errs.gen="Tất cả sân đang có trận. Lưu tỉ số hoặc thêm sân trước.";return render()}
  if(n<1){errs.gen=`Cần ít nhất 4 người đang rảnh, hiện có ${avail.length}.`;return render()}
  delete errs.gen;
  const lock=await db.doc("app/lock").acquire({holder,ttlMs:5000});
  if(!lock.acquired){toast("Có người khác đang xếp trận, thử lại sau vài giây.");return}
  const rnd=new Map(avail.map(id=>[id,Math.random()]));
  const lastB=D.SB.reduce((m,b)=>b.n>(m?.n||0)?b:m,null),prevSat=new Set(lastB?.sitting||[]);
  const rate=id=>{const s=D.st.get(id),e=s.g+s.sits;return e?s.g/e:-1};
  avail.sort((x,y)=>rate(x)-rate(y)||(prevSat.has(y)-prevSat.has(x))||D.st.get(x).last-D.st.get(y).last||rnd.get(x)-rnd.get(y));
  const chosen=avail.slice(0,n*4),sitting=avail.slice(n*4);
  const tier=id=>rate(id).toFixed(3)+"|"+(prevSat.has(id)?1:0);
  const mCount=()=>chosen.filter(id=>gOf(D,id)==="M").length;
  if(sitting.length&&mCount()%2===1){const bt=tier(chosen[chosen.length-1]);
    outer:for(let i=chosen.length-1;i>=0;i--){if(tier(chosen[i])!==bt)continue;
      for(let j=0;j<sitting.length;j++){if(tier(sitting[j])!==bt)break;
        if(gOf(D,sitting[j])!==gOf(D,chosen[i])){const t=chosen[i];chosen[i]=sitting[j];sitting[j]=t;break outer}}}}
  const pc=new Map(),oc=new Map(),inc=(m,k)=>m.set(k,(m.get(k)||0)+1);
  for(const m of D.SM){inc(pc,key(m.a[0],m.a[1]));inc(pc,key(m.b[0],m.b[1]));for(const x of m.a)for(const y of m.b)inc(oc,key(x,y))}
  const R=id=>D.st.get(id).rating;
  const GP=c.gmode==="same"?{"FM|FM":60,"FF|FF":0,"MM|MM":0,"FM|MM":150,"FM|FF":150}:{"FM|FM":0,"FF|FF":60,"MM|MM":60,"FM|MM":150,"FM|FF":150};
  const genderCost=(A,B)=>{const k=[tType(D,A),tType(D,B)].sort().join("|");return k in GP?GP[k]:Infinity};
  const cost=(A,B)=>{const g=genderCost(A,B);if(g===Infinity)return Infinity;const p1=pc.get(key(A[0],A[1]))||0,p2=pc.get(key(B[0],B[1]))||0;let o=0;for(const x of A)for(const y of B)o+=oc.get(key(x,y))||0;
    return g+10*(p1*p1+p2*p2)+3*o+12*Math.abs((R(A[0])+R(A[1]))/2-(R(B[0])+R(B[1]))/2)};
  let best=null,bc=Infinity;
  for(let it=0;it<3000;it++){
    const p=shuffle(chosen.slice());let tot=0;const ms=[];
    for(let i=0;i<n;i++){const q=p.slice(i*4,i*4+4);
      const opts=[[[q[0],q[1]],[q[2],q[3]]],[[q[0],q[2]],[q[1],q[3]]],[[q[0],q[3]],[q[1],q[2]]]];
      let bo=null,bv=Infinity;for(const [A,B] of opts){const v=cost(A,B);if(v<bv){bv=v;bo=[A,B]}}
      tot+=bv;ms.push(bo)}
    if(tot<bc){bc=tot;best=ms}
  }
  let seq=D.SM.reduce((m,x)=>Math.max(m,x.seq||0),0);
  const batch=D.SB.reduce((m,x)=>Math.max(m,x.n||0),0)+1, now=Date.now(), session=D.sid;
  await write(async()=>{
    for(let i=0;i<best.length;i++){seq++;await db.collection("matches").doc().set({session,seq,batch,court:freeCourts[i],a:best[i][0],b:best[i][1],kind:kindOf(D,{a:best[i][0],b:best[i][1]}),sa:null,sb:null,status:"playing",createdAt:now})}
    await db.collection("batches").doc("s"+session+"b"+batch).set({session,n:batch,sitting,createdAt:now});
    S.everWrote=true;
  },`Đã xếp ${best.length} trận`);
}

    await write(async()=>{
      await assignCodes();n=nextCode();
      for(const line of lines){const parts=line.split("|").map(x=>x.trim());const nmv=parts[0];if(!nmv)continue;let du="",gd=drafts.gnd||"M";for(const x of parts.slice(1)){const l=x.toLowerCase();if(["nữ","nu","f","female"].includes(l))gd="F";else if(["nam","m","male"].includes(l))gd="M";else if(x)du=x}
        const ex=have.get(nmv.toLowerCase());
        if(ex){if(ex.active===false){await db.collection("players").doc(ex.id).update({active:true});back++}continue}
        const doc={name:nmv,rating0:lvl,gender:gd,active:true,createdAt:t++,code:"PB-"+String(n++).padStart(3,"0")};if(du)doc.duprId=du;
        await db.collection("players").doc().set(doc);have.set(nmv.toLowerCase(),doc);added++}
      S.everWrote=true;delete drafts.bulk},null);
    toast(added||back?`Đã thêm ${added} người mới${back?`, ${back} người cũ vào buổi`:""}`:"Các tên này đã có mặt.")}
  else if(act==="codes"){
    const lock=await db.doc("app/lock").acquire({holder,ttlMs:8000});
    if(!lock.acquired){toast("Có người khác đang cập nhật, thử lại sau vài giây.");return}
    write(()=>assignCodes().then(()=>S.everWrote=true),"Đã cấp mã")}
  else if(act==="checkin")write(()=>db.collection("players").doc(id).update({active:true}),"Đã thêm vào buổi")
  else if(act==="checkout"){if(derive().playing.some(m=>[...m.a,...m.b].includes(id))){toast("Người này đang trên sân, lưu tỉ số trước.");return}
    write(()=>db.collection("players").doc(id).update({active:false}),"Đã cho nghỉ")}
  else if(act==="pedit"){editing.add("p-"+id);render()}
  else if(act==="pedit-x"){editing.delete("p-"+id);delete errs["p-"+id];["nm-","du-","rt-"].forEach(k=>delete drafts[k+id]);render()}
  else if(act==="pedit-save"){const p=S.players.find(x=>x.id===id);
    const nmv=String(val("nm-"+id,p.name)).trim(),du=String(val("du-"+id,p.duprId||"")).trim(),rt=Number(val("rt-"+id,p.rating0??3)),gd=val("gd-"+id,p.gender||"M");
    if(!nmv){errs["p-"+id]="Tên không được để trống.";render();return}
    if(S.players.some(x=>x.id!==id&&x.name.toLowerCase()===nmv.toLowerCase())){errs["p-"+id]="Đã có người trùng tên, thêm họ hoặc biệt danh để phân biệt.";render();return}
    delete errs["p-"+id];
    await write(()=>db.collection("players").doc(id).update({name:nmv,duprId:du,rating0:rt,gender:gd}).then(()=>{S.everWrote=true;editing.delete("p-"+id);["nm-","du-","rt-","gd-"].forEach(k=>delete drafts[k+id])}),"Đã lưu")}
  else if(act==="pdel"){if(derive().playing.some(m=>[...m.a,...m.b].includes(id))){toast("Người này đang trên sân, lưu hoặc hủy trận trước.");return}
    if(!armOr("pdel:"+id))return;write(()=>db.collection("players").doc(id).delete(),"Đã xóa người chơi")}
  else if(act==="mdel"){if(!armOr("mdel:"+id))return;write(()=>db.collection("matches").doc(id).delete(),"Đã xóa trận")}
  else if(act==="sdel"){if(!armOr("sdel:"+id))return;const sid=Number(id);
    await write(async()=>{for(const m of S.matches.filter(m=>(m.session||1)===sid))await db.collection("matches").doc(m.id).delete();
      for(const b of S.batches.filter(b=>(b.session||1)===sid))await db.collection("batches").doc(b.id).delete();
      if(S.hist.some(h=>h.sid===sid))await db.doc("app/hist-"+sid).delete();editing.delete("s-"+sid)},`Đã xóa buổi #${sid}`)}
  else if(act==="copyroster"){const D=derive();const rows=[["Ten","Gioi tinh","Rating","So tran","So buoi"]].concat(D.players.map(p=>[p.name,p.gender==="F"?"Nu":"Nam",r2(Number(p.rating0)||3),D.all.get(p.id).g,D.all.get(p.id).ses.size]));
    const txt=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(",")).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("Đã copy danh sách, dán vào Google Sheets hoặc Excel.")}
    catch(x){const box=$("#rosterbox");box.hidden=false;box.value=txt;box.focus();box.select();toast("Chọn sẵn rồi, bấm giữ để copy.")}}
  else if(act==="toggle"){const p=S.players.find(p=>p.id===id);write(()=>db.collection("players").doc(id).update({active:p.active===false}))}
  else if(act==="del")write(()=>db.collection("players").doc(id).delete(),"Đã xóa");
  else if(act==="cancel")write(()=>db.collection("matches").doc(id).delete(),"Đã hủy trận");
  else if(act==="save"||act==="edit-save"){
    const m=S.matches.find(x=>x.id===id);const pre=act==="save"?["sa-","sb-"]:["ea-","eb-"];
    const a=Number(val(pre[0]+id,act==="save"?"":m.sa)),bb=Number(val(pre[1]+id,act==="save"?"":m.sb));
    const msg=(val(pre[0]+id,"")===""&&act==="save")||(val(pre[1]+id,"")===""&&act==="save")?"Nhập điểm hai đội.":(m.giai?validG(a,bb):validScore(a,bb,cfg().target));
    if(msg){errs[id]=msg;render();return}
    delete errs[id];
    await write(()=>db.collection("matches").doc(id).update(act==="save"?{sa:a,sb:bb,status:"done",doneAt:Date.now()}:{sa:a,sb:bb}).then(()=>{S.everWrote=true;delete drafts[pre[0]+id];delete drafts[pre[1]+id];editing.delete(id)}),act==="save"?"Đã lưu tỉ số":"Đã sửa tỉ số");
    if(m.giai&&act==="save"&&!errs[id]){if(m.status!=="done")Object.assign(m,{sa:a,sb:bb,status:"done",doneAt:Date.now()});await new Promise(r=>setTimeout(r,60));await gFill()}}
  else if(act==="edit"){editing.add(id);render()}
  else if(act==="edit-x"){editing.delete(id);delete errs[id];render()}
  else if(act==="reset"){
    if(Date.now()>resetArm){resetArm=Date.now()+4000;render();setTimeout(render,4100);return}
    resetArm=0;const D=derive();
    if(D.playing.length){toast("Còn trận chưa lưu tỉ số. Lưu hoặc hủy trước khi sang buổi mới.");return}
    await write(async()=>{
      const M=money(D),firstAt=D.done.reduce((m,x)=>Math.min(m,x.doneAt||x.createdAt||Infinity),Infinity);
      await db.doc("app/hist-"+D.sid).set({sid:D.sid,title:D.c.title,startedAt:isFinite(firstAt)?firstAt:Date.now(),endedAt:Date.now(),matchCount:D.done.length,
        rows:standings(D).filter(r=>r.s.g).map(r=>({id:r.p.id,name:r.p.name,gender:r.p.gender||"M",w:r.s.w,l:r.s.l,pf:r.s.pf,pa:r.s.pa,rating:Math.round(r.s.rating*100)/100,d:Math.round(r.s.d*1000)/1000,...payRow(D,M,r.p.id)})),
        money:moneySnap(D,M),fee:{fee:D.c.fee,keo:D.c.keo,hi:D.c.hi,lo:D.c.lo,cap:D.c.cap}});
      for(const p of D.players){const s=D.st.get(p.id);if(s.g)await db.collection("players").doc(p.id).update({rating0:Math.round(s.rating*100)/100})}
      await saveCfg({session:D.sid+1,costs:{court:0,water:0,ball:0,other:0}});
    },"Đã lưu buổi, đây là trang tổng kết để chia sẻ");go("buoi",{sid:D.sid})}
});

/* ---------- boot ---------- */
async function isEditor(uid){try{return (await FB.getDoc(FB.doc(FB.fs,"editors/"+uid))).exists()}catch(e){return false}}
function makeDb(){
  const wrapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const ref=path=>{const r=FB.doc(FB.fs,path);return{
    id:r.id,path,
    set:d=>FB.setDoc(r,d),update:d=>FB.updateDoc(r,d),delete:()=>FB.deleteDoc(r),
    get:async()=>wrapDoc(await FB.getDoc(r)),
    onSnapshot:(n,e)=>FB.onSnapshot(r,{includeMetadataChanges:true},s=>n(wrapDoc(s)),e),
    acquire:async({holder,ttlMs})=>{try{return await FB.runTransaction(FB.fs,async t=>{
      const s=await t.get(r),d=s.exists()?s.data():null,now=Date.now();
      if(d&&d.holder!==holder&&d.expires>now)return{acquired:false};
      t.set(r,{holder,expires:now+(ttlMs||5000)});return{acquired:true}})}catch(e){return{acquired:false}}}
  }};
  return{doc:ref,collection:path=>{const c=FB.collection(FB.fs,path);return{
    path,doc:id=>ref(id?path+"/"+id:FB.doc(c).path),
    onSnapshot:(n,e)=>FB.onSnapshot(c,{includeMetadataChanges:true},n,e)}}};
}
(async()=>{
  render();
  if(!window.FB){S.offline=true;render();return}
  db=makeDb();
  FB.onAuthStateChanged(FB.auth,async u=>{authUser=u;canWrite=u?await isEditor(u.uid):false;render()});
  const fail=()=>{S.offline=true;render()};
  const live=meta=>{S.live=!meta.fromCache;render()};
  db.doc("app/config").onSnapshot(s=>{S.cfg=s.exists?s.data():null;live(s.metadata)},fail);
  db.collection("app").onSnapshot(q=>{S.hist=q.docs.filter(d=>d.id.startsWith("hist-")).map(d=>({id:d.id,...d.data()}));S.hReady=true;render()},fail);
  db.collection("players").onSnapshot(q=>{S.players=q.docs.map(d=>({id:d.id,...d.data()}));live(q.metadata)},fail);
  db.collection("matches").onSnapshot(q=>{S.matches=q.docs.map(d=>({id:d.id,...d.data()}));S.mReady=true;live(q.metadata)},fail);
  db.collection("batches").onSnapshot(q=>{S.batches=q.docs.map(d=>({id:d.id,...d.data()}));live(q.metadata)},fail);
})();

</script>
